<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="quote.css">
</head>
<body>
    <h2>TODAY'S QUOTE</h2>
    <div id="quote">Click the button to see a quote!</div>
    <button id="generateButton">Generate Quote</button>
    
    <div id="pictures">
        <img src="image.jpeg" alt="Inspiring Picture 1">
        <img src="download.jpeg" alt="Inspiring Picture 2">
        <img src="downloads.jpeg" alt="Inspiring Picture 3">
    </div>

    <footer>
        Footer content goes here.
        <div id="date-time"></div>
    </footer>

    <script src="quote.js"></script>
    <script>
        function updateDateTime() {
            const dateTime = new Date();
            const formattedDateTime = dateTime.toLocaleString('en-GB', { dateStyle: 'full', timeStyle: 'long' });
            document.getElementById('date-time').textContent = formattedDateTime;
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
